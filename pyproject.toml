[project]
name = "himap-refactor"
version = "0.1.0"
description = "Refactored HiMAP surrogate experiment into a structured package"
authors = [
  {name = "Research Engineer", email = "researcher@example.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.37.0",
  "datasets>=2.16.1",
  "bitsandbytes>=0.42.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.1",
  "numpy>=1.21.0",
]

[project.scripts]
himap = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
